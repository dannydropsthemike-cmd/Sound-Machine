
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#100a07">
  <meta name="description" content="A minimal brown noise sound machine.">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Brown Noise">

  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">

  <title>Brown Noise</title>
</head>

<body>

  <main class="app" id="mainApp">

    <header class="top">
      <div class="brand-mark">〰</div>
      <div>
        <p class="eyebrow">SOUND MACHINE</p>
        <h1>Brown noise</h1>
      </div>
    </header>

    <section class="player">

      <div class="orb" id="orb">
        <div class="orb-ring ring-one"></div>
        <div class="orb-ring ring-two"></div>
        <div class="wave">〜</div>
      </div>

      <p class="status" id="status">Ready when you are</p>

      <button class="play-button" id="playButton">
        <span id="playIcon">▶</span>
        <span id="playLabel">Play brown noise</span>
      </button>

    </section>

    <section class="controls">

      <div class="control-heading">
        <label for="volume">Volume</label>
        <output id="volumeValue">35%</output>
      </div>

      <input
        id="volume"
        type="range"
        min="0"
        max="100"
        value="35"
      >

      <div class="control-heading timer-heading">
        <label for="timer">Sleep timer</label>
        <span id="timerState">Off</span>
      </div>

      <select id="timer">
        <option value="0">Off — play continuously</option>
        <option value="15">15 minutes</option>
        <option value="30">30 minutes</option>
        <option value="45">45 minutes</option>
        <option value="60">1 hour</option>
        <option value="90">1 hour 30 minutes</option>
        <option value="120">2 hours</option>
      </select>

      <p class="hint">The timer fades the sound out gently.</p>

    </section>

    <button class="standby-entry" id="standbyButton">
      <span>◷</span> Enter standby mode
    </button>

    <footer>Deep, continuous brown noise</footer>

  </main>

  <!-- STANDBY DISPLAY -->

  <main class="standby" id="standbyScreen" hidden>

    <section class="photo-panel">

      <img id="standbyPhoto" alt="Standby photo" hidden>

      <div class="empty-photos" id="emptyPhotos">
        <span>＋</span>
        <p>Add photos</p>
      </div>

      <div class="photo-controls">
        <button id="previousPhoto" aria-label="Previous photo">‹</button>
        <button id="uploadPhotos">＋ Photos</button>
        <button id="nextPhoto" aria-label="Next photo">›</button>
      </div>

      <input
        type="file"
        id="photoInput"
        accept="image/*"
        multiple
        hidden
      >

    </section>

    <section class="clock-panel">

      <div class="clock-content">
        <div id="clock" class="clock">12:00 AM</div>
        <div id="clockDate" class="clock-date"></div>
      </div>

      <button id="exitStandby" class="exit-standby">
        Exit
      </button>

    </section>

  </main>

  <script src="./app.js"></script>

</body>
</html>
